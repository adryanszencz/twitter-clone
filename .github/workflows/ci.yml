name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: twitter_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d twitter_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SQL_ENGINE: django.db.backends.postgresql
      SQL_DATABASE: twitter_dev
      SQL_USER: dev
      SQL_PASSWORD: dev
      SQL_HOST: localhost
      SQL_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o Poetry e as dependências
        run: |
          pip install poetry==2.5.1
          poetry install --no-root

      - name: Lint (flake8)
        run: poetry run flake8 .

      - name: Checar as migrações
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Testes
        run: poetry run python manage.py test
