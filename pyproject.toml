[tool.poetry]
package-mode = false

[project]
name = "twitter-clone"
version = "0.1.0"
description = "Clone do Twitter (EBAC)"
authors = [
    {name = "Adryan Szenczuk",email = "adryanszenczuk@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=5.2,<6.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "factory-boy (>=3.3.3,<4.0.0)",
    "flake8 (>=7.5.0,<8.0.0)"
]
